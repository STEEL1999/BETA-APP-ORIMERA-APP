name: Build Flutter Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean and create Android
        run: |
          rm -rf android pubspec.lock
          flutter create . --platforms android --org com.example.app

      - name: Install dependencies
        run: flutter pub get

      # SOLUCIÓN DEFINITIVA: Inyecta el plugin de Kotlin a nivel global para subproyectos como :jni
      - name: Apply Kotlin Plugin Globally to All Subprojects
        run: |
          BUILD_GRADLE="android/build.gradle.kts"
          if [ -f "$BUILD_GRADLE" ]; then
            echo '
            subprojects {
                afterEvaluate { project ->
                    if (project.plugins.hasPlugin("com.android.library") || project.plugins.hasPlugin("com.android.application")) {
                        project.plugins.apply("org.jetbrains.kotlin.android")
                    }
                }
            }
            ' >> "$BUILD_GRADLE"
          fi

      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build Flutter Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean locks and cache
        run: |
          rm -f pubspec.lock
          flutter pub cache clean --force

      - name: Create missing native Android files
        run: flutter create . --platforms android --android-language kotlin

      # PASO DEFINITIVO: Configura Kotlin a nivel raíz de Gradle para que paquetes como :jni no fallen
      - name: Inject Kotlin Plugin into Gradle
        run: |
          echo 'buildscript { ext.kotlin_version = "1.8.22"; repositories { google(); mavenCentral() }; dependencies { classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" } }' | cat - android/build.gradle > temp && mv temp android/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build Flutter Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean everything and regenerate project
        run: |
          rm -rf android pubspec.lock
          flutter create . --platforms android --org com.example.app

      # PASO CLAVE: Forzar la inicialización global del plugin de Kotlin para librerías dependientes como :jni
      - name: Force Kotlin Gradle Plugin Globally
        run: |
          mkdir -p ~/.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> ~/.gradle/init.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build Flutter Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean everything and regenerate project
        run: |
          rm -rf android pubspec.lock
          flutter create . --platforms android --org com.example.app

      - name: Install dependencies
        run: flutter pub get

      # SOLUCIÓN RADICAL: Inyecta el plugin de Kotlin directamente en el archivo build.gradle de la librería jni en caché
      - name: Patch JNI Plugin Build.gradle
        run: |
          JNI_GRADLE=$(find ~/.pub-cache -path "*/jni-*/android/build.gradle" | head -n 1)
          if [ -f "$JNI_GRADLE" ]; then
            echo "Patching $JNI_GRADLE"
            echo -e '\napply plugin: "org.jetbrains.kotlin.android"\n' >> "$JNI_GRADLE"
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
